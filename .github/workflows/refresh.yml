name: refresh card

# Re-renders the SVG so the thesis countdown stays current.
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Render
        run: python3 assets/render_run.py

      - name: Commit if the countdown moved
        run: |
          git config user.name  "Dmitrijs Sizovs"
          git config user.email "94475391+dSizovs@users.noreply.github.com"
          git add assets/run-dark.svg assets/run-light.svg
          git diff --staged --quiet && echo "no change" && exit 0
          git commit -m "Refresh countdown"
          git push
